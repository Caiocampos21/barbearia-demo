# Configuração de deploy do Netlify (site 100% estático)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Rotas do React Router (/agendar, /painel...) devem abrir o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache longo para os arquivos com hash gerados pelo Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
